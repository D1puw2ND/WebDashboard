<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Process Monitor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:        #0a0a0f;
    --surface:   #111118;
    --border:    #1e1e2e;
    --accent:    #00ff88;
    --accent2:   #0088ff;
    --danger:    #ff3b5c;
    --warn:      #ffb800;
    --text:      #e0e0f0;
    --muted:     #4a4a6a;
    --glow:      0 0 20px rgba(0,255,136,.25);
    --glow-r:    0 0 20px rgba(255,59,92,.3);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Scanline overlay ── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 9999;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,.06) 2px,
      rgba(0,0,0,.06) 4px
    );
    pointer-events: none;
  }

  /* ── Noise texture ── */
  body::after {
    content: '';
    position: fixed; inset: 0; z-index: 9998;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    opacity: .4;
    pointer-events: none;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    background: rgba(17,17,24,.95);
    backdrop-filter: blur(12px);
    position: relative;
    z-index: 10;
    flex-shrink: 0;
  }

  .brand {
    display: flex; align-items: center; gap: 12px;
  }
  .brand-icon {
    width: 32px; height: 32px;
    border: 1.5px solid var(--accent);
    border-radius: 6px;
    display: grid; place-items: center;
    box-shadow: var(--glow);
  }
  .brand-icon svg { width: 16px; height: 16px; }
  .brand-name {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: .08em;
    color: #fff;
  }
  .brand-name span { color: var(--accent); }

  .header-right { display: flex; align-items: center; gap: 20px; }

  /* Status pill */
  .status-pill {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 14px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.03);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .06em;
    transition: all .3s;
  }
  .status-pill.running {
    border-color: var(--accent);
    background: rgba(0,255,136,.06);
    box-shadow: var(--glow);
    color: var(--accent);
  }
  .status-pill.stopped {
    border-color: var(--muted);
    color: var(--muted);
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
  }
  .dot.pulse {
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .4; transform: scale(.7); }
  }

  /* Clock */
  #clock {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .06em;
  }

  /* ── Main layout ── */
  main {
    flex: 1;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 0;
    overflow: hidden;
    padding: 20px 28px;
  }

  /* ── Stats bar ── */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    opacity: 0;
    transition: opacity .3s;
  }
  .stat-card.active::before { opacity: 1; }
  .stat-label {
    font-size: 9px;
    letter-spacing: .12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .stat-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    transition: color .3s;
  }
  .stat-card.active .stat-value { color: var(--accent); }

  /* ── Terminal ── */
  .terminal-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }

  .terminal-titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,.3);
    flex-shrink: 0;
  }
  .traffic-lights {
    display: flex; gap: 6px;
  }
  .tl {
    width: 10px; height: 10px; border-radius: 50%;
  }
  .tl.red    { background: #ff5f57; }
  .tl.yellow { background: #ffbd2e; }
  .tl.green  { background: #28c840; }
  .terminal-title {
    font-size: 11px; color: var(--muted);
    letter-spacing: .06em;
  }
  .terminal-actions { display: flex; gap: 8px; }
  .btn-tiny {
    background: none; border: 1px solid var(--border);
    border-radius: 5px; padding: 3px 9px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--muted);
    cursor: pointer; transition: all .2s;
    letter-spacing: .04em;
  }
  .btn-tiny:hover { border-color: var(--accent); color: var(--accent); }

  #terminal {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    font-size: 12.5px;
    line-height: 1.7;
    min-height: 0;
    scroll-behavior: smooth;
  }

  /* Custom scrollbar */
  #terminal::-webkit-scrollbar { width: 4px; }
  #terminal::-webkit-scrollbar-track { background: transparent; }
  #terminal::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 2px;
  }
  #terminal::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  .log-line {
    display: flex; gap: 12px; align-items: baseline;
    padding: 1px 0;
    animation: fadeSlide .15s ease-out;
  }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .log-time {
    color: var(--muted);
    font-size: 10px;
    flex-shrink: 0;
    user-select: none;
    margin-top: 2px;
  }
  .log-text { color: var(--text); word-break: break-word; flex: 1; }
  .log-line.sys .log-text  { color: var(--accent2); }
  .log-line.err .log-text  { color: var(--danger); }
  .log-line.warn .log-text { color: var(--warn); }
  .log-line.info .log-text { color: var(--accent); }

  /* Cursor blink */
  .cursor {
    display: inline-block;
    width: 8px; height: 14px;
    background: var(--accent);
    margin-left: 4px;
    vertical-align: middle;
    animation: blink .8s step-end infinite;
    border-radius: 1px;
  }
  @keyframes blink {
    0%,100% { opacity: 1; }
    50%      { opacity: 0; }
  }
  .cursor.hidden { display: none; }

  /* ── Controls ── */
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-top: 16px;
    flex-shrink: 0;
  }

  .btn {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 28px;
    border-radius: 8px;
    border: none; cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 500;
    letter-spacing: .08em;
    transition: all .2s;
    position: relative; overflow: hidden;
  }
  .btn::after {
    content: '';
    position: absolute; inset: 0;
    background: rgba(255,255,255,.1);
    opacity: 0;
    transition: opacity .2s;
  }
  .btn:hover::after { opacity: 1; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn:disabled::after { display: none; }

  .btn-start {
    background: var(--accent);
    color: #000;
    box-shadow: var(--glow);
  }
  .btn-stop {
    background: var(--danger);
    color: #fff;
    box-shadow: var(--glow-r);
  }

  .btn svg { width: 14px; height: 14px; flex-shrink: 0; }

  .spacer { flex: 1; }

  .log-count {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .04em;
  }
  .log-count span {
    color: var(--accent);
    font-weight: 700;
  }

  /* Auto scroll toggle */
  .autoscroll-wrap {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; color: var(--muted);
    cursor: pointer; user-select: none;
  }
  .toggle {
    width: 28px; height: 16px;
    background: var(--border);
    border-radius: 100px;
    position: relative;
    transition: background .2s;
  }
  .toggle.on { background: var(--accent); }
  .toggle::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #fff;
    transition: transform .2s;
  }
  .toggle.on::after { transform: translateX(12px); }

  /* ── Exit code badge ── */
  #exit-badge {
    display: none;
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 500;
    border: 1px solid;
  }
  #exit-badge.ok  { color: var(--accent);  border-color: var(--accent);  background: rgba(0,255,136,.06); }
  #exit-badge.err { color: var(--danger);  border-color: var(--danger);  background: rgba(255,59,92,.06); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 16 16" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-linecap="round">
        <polyline points="3,5 1,8 3,11"/>
        <polyline points="13,5 15,8 13,11"/>
        <line x1="6" y1="3" x2="10" y2="13"/>
      </svg>
    </div>
    <span class="brand-name">PROC<span>WATCH</span></span>
  </div>

  <div class="header-right">
    <div id="status-pill" class="status-pill stopped">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">STOPPED</span>
    </div>
    <span id="clock">--:--:--</span>
  </div>
</header>

<main>
  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-card" id="stat-lines">
      <div class="stat-label">Total Lines</div>
      <div class="stat-value" id="val-lines">0</div>
    </div>
    <div class="stat-card" id="stat-uptime">
      <div class="stat-label">Uptime</div>
      <div class="stat-value" id="val-uptime">--</div>
    </div>
    <div class="stat-card" id="stat-rate">
      <div class="stat-label">Lines / sec</div>
      <div class="stat-value" id="val-rate">0</div>
    </div>
    <div class="stat-card" id="stat-pid">
      <div class="stat-label">Exit Code</div>
      <div class="stat-value" id="val-exit">--</div>
    </div>
  </div>

  <!-- Terminal -->
  <div class="terminal-wrap">
    <div class="terminal-titlebar">
      <div class="traffic-lights">
        <div class="tl red"></div>
        <div class="tl yellow"></div>
        <div class="tl green"></div>
      </div>
      <span class="terminal-title">main.py — output stream</span>
      <div class="terminal-actions">
        <button class="btn-tiny" onclick="clearLogs()">CLEAR</button>
        <button class="btn-tiny" onclick="downloadLogs()">EXPORT</button>
      </div>
    </div>

    <div id="terminal">
      <div class="log-line sys">
        <span class="log-time">--:--:--</span>
        <span class="log-text">[ ProcWatch siap. Klik START untuk menjalankan main.py ]</span>
      </div>
      <span class="cursor" id="cursor"></span>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn btn-start" id="btn-start" onclick="startProcess()">
      <svg viewBox="0 0 16 16" fill="currentColor"><polygon points="4,2 14,8 4,14"/></svg>
      START
    </button>
    <button class="btn btn-stop" id="btn-stop" onclick="stopProcess()" disabled>
      <svg viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="3" width="10" height="10" rx="1.5"/></svg>
      FORCE STOP
    </button>

    <div class="spacer"></div>

    <span class="log-count">Lines: <span id="line-counter">0</span></span>

    <label class="autoscroll-wrap" onclick="toggleAutoScroll()">
      <div class="toggle on" id="as-toggle"></div>
      Auto-scroll
    </label>
  </div>
</main>

<script>
  const socket = io();
  const terminal = document.getElementById('terminal');
  const cursor   = document.getElementById('cursor');
  const btnStart = document.getElementById('btn-start');
  const btnStop  = document.getElementById('btn-stop');

  let autoScroll = true;
  let lineCount  = 0;
  let startTime  = null;
  let uptimeTimer = null;
  let linesThisSec = 0;
  let rateTimer  = null;
  let logBuffer  = [];

  // ── Clock ──────────────────────────────────────────
  function updateClock() {
    const n = new Date();
    document.getElementById('clock').textContent =
      n.toTimeString().slice(0,8);
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ── Socket events ──────────────────────────────────
  socket.on('connect', () => {
    addLine('[ WebSocket terhubung ke server ]', 'sys');
  });

  socket.on('disconnect', () => {
    addLine('[ WebSocket terputus! ]', 'err');
    setStatus(false);
  });

  socket.on('status', d => setStatus(d.running));

  socket.on('log', d => {
    addLine(d.data);
    linesThisSec++;
  });

  socket.on('process_ended', d => {
    const code = d.code;
    addLine(`[ Process selesai. Exit code: ${code} ]`, code === 0 ? 'info' : 'err');
    document.getElementById('val-exit').textContent = code;
    document.getElementById('stat-pid').classList.toggle('active', code === 0);
    setStatus(false);
    stopUptime();
  });

  // ── Status ─────────────────────────────────────────
  function setStatus(running) {
    const pill = document.getElementById('status-pill');
    const dot  = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    pill.className = 'status-pill ' + (running ? 'running' : 'stopped');
    dot.className  = 'dot' + (running ? ' pulse' : '');
    text.textContent = running ? 'RUNNING' : 'STOPPED';
    btnStart.disabled = running;
    btnStop.disabled  = !running;
    cursor.className  = 'cursor' + (running ? '' : ' hidden');

    ['stat-lines','stat-uptime','stat-rate'].forEach(id =>
      document.getElementById(id).classList.toggle('active', running)
    );
  }

  // ── Controls ───────────────────────────────────────
  function startProcess() {
    socket.emit('start');
    startTime = Date.now();
    document.getElementById('val-exit').textContent = '--';
    startUptime();
    startRate();
    addLine('[ Mengirim perintah START... ]', 'sys');
  }

  function stopProcess() {
    socket.emit('stop');
    addLine('[ Mengirim perintah FORCE STOP... ]', 'warn');
  }

  // ── Uptime ─────────────────────────────────────────
  function startUptime() {
    stopUptime();
    uptimeTimer = setInterval(() => {
      if (!startTime) return;
      const s = Math.floor((Date.now() - startTime) / 1000);
      const h = Math.floor(s / 3600).toString().padStart(2,'0');
      const m = Math.floor((s % 3600) / 60).toString().padStart(2,'0');
      const sec = (s % 60).toString().padStart(2,'0');
      document.getElementById('val-uptime').textContent = `${h}:${m}:${sec}`;
    }, 1000);
  }
  function stopUptime() {
    if (uptimeTimer) { clearInterval(uptimeTimer); uptimeTimer = null; }
  }

  // ── Line rate ──────────────────────────────────────
  function startRate() {
    if (rateTimer) clearInterval(rateTimer);
    rateTimer = setInterval(() => {
      document.getElementById('val-rate').textContent = linesThisSec;
      linesThisSec = 0;
    }, 1000);
  }

  // ── Add log line ───────────────────────────────────
  function addLine(text, type) {
    lineCount++;
    document.getElementById('val-lines').textContent = lineCount;
    document.getElementById('line-counter').textContent = lineCount;
    logBuffer.push({ time: new Date().toTimeString().slice(0,8), text, type });

    const line = document.createElement('div');
    line.className = 'log-line' + (type ? ' ' + type : '');

    const t = document.createElement('span');
    t.className = 'log-time';
    t.textContent = new Date().toTimeString().slice(0,8);

    const s = document.createElement('span');
    s.className = 'log-text';
    s.textContent = text;

    line.appendChild(t);
    line.appendChild(s);

    // Insert before cursor
    terminal.insertBefore(line, cursor);

    if (autoScroll) {
      terminal.scrollTop = terminal.scrollHeight;
    }
  }

  // ── Auto-scroll toggle ─────────────────────────────
  function toggleAutoScroll() {
    autoScroll = !autoScroll;
    const tog = document.getElementById('as-toggle');
    tog.className = 'toggle' + (autoScroll ? ' on' : '');
    if (autoScroll) terminal.scrollTop = terminal.scrollHeight;
  }

  // ── Clear ──────────────────────────────────────────
  function clearLogs() {
    const lines = terminal.querySelectorAll('.log-line');
    lines.forEach(l => l.remove());
    lineCount = 0;
    logBuffer = [];
    document.getElementById('val-lines').textContent = '0';
    document.getElementById('line-counter').textContent = '0';
    addLine('[ Log dibersihkan ]', 'sys');
  }

  // ── Export ─────────────────────────────────────────
  function downloadLogs() {
    const content = logBuffer.map(l => `[${l.time}] ${l.text}`).join('\n');
    const blob = new Blob([content], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `procwatch_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.log`;
    a.click();
  }

  // ── Keyboard shortcuts ─────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
      e.preventDefault();
      if (!btnStart.disabled) startProcess();
    }
    if (e.key === 'Escape') {
      if (!btnStop.disabled) stopProcess();
    }
  });
</script>
</body>
</html>
